name: 批量生成 config JSON
on:
  workflow_dispatch:   # 手动触发
    inputs:
      prefix:
        description: '文件名前缀，例如 xm / abc / lv（默认 xm）'
        required: false
        default: 'xm'
      start:
        description: '起始编号（含），例如 1'
        required: true
        default: '1'
      end:
        description: '结束编号（含），例如 200'
        required: true
        default: '200'
      width:
        description: '编号位数（默认 2，即 xm01；超过范围自动升级为 3 位）'
        required: false
        default: '2'
      title:
        description: '生成的 data.title 内容'
        required: false
        default: 'welcome'
      br_title:
        description: '生成的 data.br_title 内容'
        required: false
        default: ''
      ph_title:
        description: '生成的 data.ph_title 内容'
        required: false
        default: ''
      shorts:
        description: '生成的 data.short 列表，逗号分隔，例如 A,B,C'
        required: false
        default: 'A,B,C'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 推送改动回仓库
    steps:
    - name: 拉取代码
      uses: actions/checkout@v4
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: 生成 JSON 文件
      env:
        PREFIX: ${{ inputs.prefix }}
        START: ${{ inputs.start }}
        END: ${{ inputs.end }}
        WIDTH: ${{ inputs.width }}
        TITLE: ${{ inputs.title }}
        BR_TITLE: ${{ inputs.br_title }}
        PH_TITLE: ${{ inputs.ph_title }}
        SHORTS: ${{ inputs.shorts }}
      run: |
        python - <<'PY'
        import json, os

        prefix   = os.environ["PREFIX"].strip()
        START    = int(os.environ["START"])
        END      = int(os.environ["END"])
        WIDTH    = int(os.environ["WIDTH"])
        TITLE    = os.environ["TITLE"]
        BR_TITLE = os.environ["BR_TITLE"]
        PH_TITLE = os.environ["PH_TITLE"]
        SHORTS   = [s.strip() for s in os.environ["SHORTS"].split(",") if s.strip()]

        def name_of(n):
            w = WIDTH
            # 若超过当前位数能表示的最大值，自动加位数，避免与现有文件冲突
            if n > 10 ** w - 1:
                w = len(str(n))
            return f"{prefix}{n:0{w}d}.json"

        os.makedirs("config", exist_ok=True)
        created, skipped = [], []
        for i in range(START, END + 1):
            fn = name_of(i)
            path = os.path.join("config", fn)
            # 若已存在同名文件，绝不覆盖，仅跳过
            if os.path.isfile(path):
                print(f"跳过(已存在，不覆盖): {fn}")
                skipped.append(fn)
                continue
            payload = {"data": {
                "title": TITLE,
                "br_title": BR_TITLE,
                "ph_title": PH_TITLE,
                "short": SHORTS,
            }}
            with open(path, "w", encoding="utf-8") as f:
                json.dump(payload, f, ensure_ascii=False, indent=2)
            print(f"已新建: {fn}")
            created.append(fn)
        print("本次新增:", created if created else "无")
        print("本次跳过(已存在):", skipped if skipped else "无")
        print("全部处理完成！")
        PY
    - name: 提交并推送修改
      env:
        PREFIX: ${{ inputs.prefix }}
        START: ${{ inputs.start }}
        END: ${{ inputs.end }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "config/${PREFIX}*.json" || true
        # 仅当有实际变更时才提交；无变更则跳过提交与推送
        if git diff --staged --quiet; then
          echo "没有需要提交的变更，跳过。"
          exit 0
        fi
        git commit -m "批量生成 config 下的 JSON 文件 (prefix=${PREFIX}, start=${START}, end=${END})"
        git pull --rebase --autostash || true
        git push
