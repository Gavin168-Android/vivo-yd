name: 批量更新 title / short

on:
  workflow_dispatch:   # 手动触发
    inputs:
      prefix:
        description: '文件名前缀，例如 xm / abc / lv（默认 xm）'
        required: false
        default: 'xm'
      title:
        description: '新的 data.title 内容（留空则不更新 title）'
        required: false
        default: ''
      br_title:
        description: '新的 data.br_title 内容（留空则不更新 br_title）'
        required: false
        default: ''
      ph_title:
        description: '新的 data.ph_title 内容（留空则不更新 ph_title）'
        required: false
        default: ''
      shorts:
        description: '新的 data.short 列表，逗号分隔，例如 A,B,C（留空则不更新 short）'
        required: false
        default: ''
      start:
        description: '起始文件序号（含），例如 1 表示仅处理 <前缀>1.json 及之后的文件（留空则从头开始）'
        required: false
        default: ''
      end:
        description: '结束文件序号（含），例如 10 表示仅处理到 <前缀>10.json（留空则到末尾）'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 推送改动回仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        env:
          PREFIX: ${{ inputs.prefix }}
          NEW_TITLE: ${{ inputs.title }}
          NEW_BR_TITLE: ${{ inputs.br_title }}
          NEW_PH_TITLE: ${{ inputs.ph_title }}
          NEW_SHORTS: ${{ inputs.shorts }}
          START_IN: ${{ inputs.start }}
          END_IN: ${{ inputs.end }}
        run: |
          python - <<'PY'
          import json, glob, os, re

          PREFIX       = os.environ["PREFIX"].strip()
          NEW_TITLE    = os.environ["NEW_TITLE"]
          NEW_BR_TITLE = os.environ["NEW_BR_TITLE"]
          NEW_PH_TITLE = os.environ["NEW_PH_TITLE"]
          SHORTS_RAW   = os.environ["NEW_SHORTS"]
          NEW_SHORTS   = [s.strip() for s in SHORTS_RAW.split(",") if s.strip()] if SHORTS_RAW else []
          FILE_PATTERN = f"config/{PREFIX}*.json"
          INDEX_RE     = re.compile(rf"{re.escape(PREFIX)}(\d+)\.json$")

          def to_int_or_none(v):
              v = (v or "").strip()
              if not v:
                  return None
              try:
                  return int(v)
              except ValueError:
                  print(f"警告：start/end 不是合法整数，已忽略: {v!r}")
                  return None

          START = to_int_or_none(os.environ["START_IN"])
          END   = to_int_or_none(os.environ["END_IN"])

          def file_index(fp):
              m = INDEX_RE.search(fp)
              return int(m.group(1)) if m else None

          matched = glob.glob(FILE_PATTERN)
          # 按文件序号排序，便于阅读输出；无法解析序号的排到最后
          matched.sort(key=lambda fp: (file_index(fp) is None, file_index(fp) if file_index(fp) is not None else 0))

          for filepath in matched:
              idx = file_index(filepath)
              if idx is None:
                  print(f"跳过（文件名不符合 {PREFIX}<数字>.json）: {filepath}")
                  continue
              if START is not None and idx < START:
                  continue
              if END is not None and idx > END:
                  continue

              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if "data" not in data:
                      data["data"] = {}
                  changed = []
                  if NEW_TITLE:
                      old = data["data"].get("title")
                      data["data"]["title"] = NEW_TITLE
                      changed.append(f"title: {old} -> {NEW_TITLE}")
                  if NEW_BR_TITLE:
                      old = data["data"].get("br_title")
                      data["data"]["br_title"] = NEW_BR_TITLE
                      changed.append(f"br_title: {old} -> {NEW_BR_TITLE}")
                  if NEW_PH_TITLE:
                      old = data["data"].get("ph_title")
                      data["data"]["ph_title"] = NEW_PH_TITLE
                      changed.append(f"ph_title: {old} -> {NEW_PH_TITLE}")
                  if NEW_SHORTS:
                      old = data["data"].get("short")
                      data["data"]["short"] = NEW_SHORTS
                      changed.append(f"short: {old} -> {NEW_SHORTS}")

                  if changed:
                      with open(filepath, "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      print(f"[{idx}] 已修改: {filepath}  |  " + "; ".join(changed))
                  else:
                      print(f"[{idx}] 无变更: {filepath}")
              except Exception as e:
                  print(f"[{idx}] 处理失败 {filepath}: {e}")

          print("\n全部处理完成！")
          PY

      - name: 提交并推送修改
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "config/${PREFIX}*.json" || true
          if git diff --staged --quiet; then
            echo "没有需要提交的变更，跳过。"
            exit 0
          fi
          git commit -m "批量更新 config 下的 title/br_title/ph_title/short 字段 (prefix=${PREFIX})"
          git pull --rebase --autostash || true
          git push
